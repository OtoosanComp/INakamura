
name: Build Nakamura Twins Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify project files
        run: |
          set -eu
          test -f package.json
          test -f capacitor.config.ts
          test -f nts-icon-512.png
          test -f mipmap-mdpi.png
          test -f mipmap-hdpi.png
          test -f mipmap-xhdpi.png
          test -f mipmap-xxhdpi.png
          test -f mipmap-xxxhdpi.png
          echo "Archivos principales encontrados."

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply launcher icon
        shell: bash
        run: |
          set -eu
          RES="android/app/src/main/res"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$density"
            cp "mipmap-$density.png" \
              "$RES/mipmap-$density/ic_launcher.png"
            cp "mipmap-$density.png" \
              "$RES/mipmap-$density/ic_launcher_round.png"
          done

          mkdir -p "$RES/drawable"
          cp nts-icon-512.png \
            "$RES/drawable/nts_launcher_foreground.png"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ -s "$APK" ]; then
            sha256sum "$APK" > diagnostics/apk-sha256.txt
            ls -lh "$APK" > diagnostics/apk-size.txt

            SIGNER="$(find "$ANDROID_HOME/build-tools" \
              -name apksigner -type f | sort -V | tail -n 1)"

            if [ -n "$SIGNER" ]; then
              "$SIGNER" verify --verbose "$APK" \
                > diagnostics/apk-signature.txt 2>&1 || true
            else
              echo "No se encontró apksigner." \
                > diagnostics/apk-signature.txt
            fi
          else
            echo "No se generó el APK." \
              > diagnostics/apk-size.txt
          fi

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nakamura-Twins-Studio-0.4-test-apk-and-diagnostics
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            diagnostics/*
          if-no-files-found: warn
          retention-days: 14
          
