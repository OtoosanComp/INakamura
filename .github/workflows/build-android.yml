
name: Build Nakamura Twins Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: unzip -q NakamuraTwinsStudio_Mobile_0.1_Source.zip -d source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: source/NakamuraTwinsStudio_Mobile_0.1
        run: npm install

      - name: Build web app
        working-directory: source/NakamuraTwinsStudio_Mobile_0.1
        run: npm run build

      - name: Generate Android project
        working-directory: source/NakamuraTwinsStudio_Mobile_0.1
        run: npx cap add android

      - name: Sync Android assets
        working-directory: source/NakamuraTwinsStudio_Mobile_0.1
        run: npx cap sync android

      - name: Build debug APK
        working-directory: source/NakamuraTwinsStudio_Mobile_0.1/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nakamura-Twins-Studio-Mobile-0.1-debug-apk
          path: source/NakamuraTwinsStudio_Mobile_0.1/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
