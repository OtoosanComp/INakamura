# Voz de Yami — motor Kokoro v1.0 (licencia Apache-2.0: uso comercial permitido).
# Diseño: suave, cercana, natural. Centro tonal Sol3 (196 Hz) = cuarta de Re, complementa a Tsuki (Re).
# (Antes: La3 = 220 Hz; se cambió porque subir ~4 semitonos sonaba más robótico; Sol3 solo pide ~1-2.)
# La mezcla base mide ~180 Hz y se afina conservando formantes. Sin eco: el eco corto sonaba metálico.
nombre: Yami
motor: kokoro-v1.0
mezcla:            # estilo de voz = suma ponderada de voces de Kokoro
  - [ef_dora, 0.75]  # española, femenina
  - [af_heart, 0.25] # calidez/claridad
velocidad: 0.9     # 1.0 = normal; más bajo = más lento
f0_objetivo_hz: 196.0   # Sol3 (La3 = 220.0 si se prefiere)
pausa_entre_escenas_s: 0.40
# Cadena de efectos (ffmpeg) aplicada DESPUÉS del cambio de tono:
efectos: >-
  highpass=f=80,lowpass=f=12000,
  equalizer=f=250:t=q:w=1:g=1.5,equalizer=f=3000:t=q:w=1.5:g=-1.5,
  acompressor=threshold=-22dB:ratio=2.5:attack=15:release=200
