# Fondos genéricos del largo 02 (16:9, calidad media). Solo escenarios y objetos: sin personas, sin sangre, sin armas.
formato: horizontal
escalar: false
estilo: >-
  anime background art, cinematic lighting, dark melancholic atmosphere, purple and crimson tones,
  highly detailed, masterpiece, best quality, no humans
negativo: >-
  blood, gore, corpse, weapon, knife, gun, violence, nsfw, nude, 1girl, girl, woman, man, person, human, face, body,
  text, letters, watermark, signature, logo, lowres, blurry, deformed

fondos:
