    prompt: quiet residential street in a japanese suburb at night, utility poles and wires, single streetlight, closed shutters, wet asphalt, lonely
    semilla: 301
  - id: h-leyes
    prompt: old thick law book open on a wooden desk with scales of justice, warm desk lamp, dark office at night, documents and stamps
    semilla: 311
