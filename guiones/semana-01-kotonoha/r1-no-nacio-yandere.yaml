  - visual: fondo/kotonoha-retrato
    tono: softly
    texto: "La yandere más famosa del anime... no nació así."
  - visual: yami/susurrando
    tono: whispering
    texto: "No tengas miedo... yo te explico por qué pasó."
  - visual: fondo/salon-vacio
    etiqueta: "SCHOOL DAYS · 2007"
    tono: calm
    texto: "[School Days|Escul Deis], [2007|dos mil siete]. [Kotonoha|Kotonoja] era la chica tímida del salón: buena alumna, callada, siempre con un libro."
  - visual: fondo/telefono-noche
    etiqueta: "DATO 1"
    tono: serious
    texto: "Primero: su novio, Makoto, le confesó a otra chica que se aburría con ella."
  - visual: fondo/pasillo-rumores
    etiqueta: "DATO 2"
    tono: serious
    texto: "Segundo: empezaron los rumores sobre ella... y se fue quedando sola."
  - visual: yami/sorprendida
    etiqueta: "DATO 3"
    tono: curious
    texto: "Tercero: él le dijo que ya no le gustaba... y días después volvió a consolarla, como si nada."
  - visual: yami/seria
    etiqueta: "VÍNCULO TRAUMÁTICO"
    tono: calm
    texto: "Eso tiene nombre: vínculo traumático. Cuando alguien te lastima y después te da cariño, el apego no se rompe... se hace más fuerte."
  - visual: fondo/estacion-lluvia
    tono: softly
    texto: "No es un diagnóstico, es un personaje... pero pasa en la vida real."
  - visual: yami/pensativa
    tono: curious
    texto: "Entonces... ¿[Kotonoha|Kotonoja] era yandere, o la volvieron una?"
  - visual: yami/tierna
    tono: playful
    texto: "¿Tú qué hubieras hecho, uwu?"

